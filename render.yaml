# Blueprint de Render: la capacidad de notificaciones en el plan gratis (ADR-013).
# Sube el api-gateway, una instancia de notificaciones y un Key Value. El resto del
# sistema corre en el compose local. Las variables con sync: false se cargan a mano
# en Render la primera vez: son secretos o dependen de la URL que asigne Render.

services:
  - type: web
    name: recienhecho-api-gateway
    runtime: docker
    plan: free
    region: oregon
    branch: feature/notificaciones-render
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    healthCheckPath: /health
    envVars:
      - key: GIN_MODE
        value: release
      # Un web service gratis no recibe tráfico por la red privada de Render: el
      # gateway llega a notificaciones por su URL pública, https://<nombre>.onrender.com.
      - key: NOTIFICACIONES_URLS
        sync: false
      # Estos servicios no suben a Render: sus rutas responden 503.
      - key: PEDIDOS_URLS
        value: http://pedidos.invalid
      - key: PRODUCTOS_URLS
        value: http://productos.invalid
      - key: USUARIOS_URLS
        value: http://usuarios.invalid
      # Sin usuarios no se firma ningún token; el gateway igual exige el secreto.
      - key: JWT_SECRETO
        generateValue: true
      # Las mismas claves que en notificaciones, para el límite por grupo (ADR-004).
      - key: NOTIFICACIONES_CLAVES_API
        sync: false
      - key: NOTIFICACIONES_LIMITE_POR_MINUTO
        value: "60"

  - type: web
    name: recienhecho-notificaciones
    runtime: docker
    plan: free
    region: oregon
    branch: feature/notificaciones-render
    dockerfilePath: ./backend/notificaciones/Dockerfile
    dockerContext: ./backend/notificaciones
    healthCheckPath: /vivo
    envVars:
      - key: GIN_MODE
        value: release
      # Key Value en lugar de MongoDB, y sin RABBITMQ_URL (ADR-002, ADR-013).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: recienhecho-notificaciones-datos
          property: connectionString
      - key: NOTIFICACIONES_CLAVES_API
        sync: false
      # Brevo por el puerto 2525: Render gratis bloquea 25, 465 y 587 (ADR-005).
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PUERTO
        value: "2525"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_CLAVE
        sync: false
      # Tiene que ser un remitente verificado en Brevo.
      - key: SMTP_REMITENTE
        sync: false

  - type: keyvalue
    name: recienhecho-notificaciones-datos
    plan: free
    region: oregon
    # Solo desde los servicios de Render: sin acceso desde internet.
    ipAllowList: []
    # Sin desalojo: una notificación no se puede borrar por falta de memoria.
    maxmemoryPolicy: noeviction
