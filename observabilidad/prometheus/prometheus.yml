# Prometheus de Recién hecho (ADR-006). Cada 15 s lee /metrics de cada servicio
# por la red interna del compose (el puerto 9464 no se publica al host).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9464"]

  - job_name: notificaciones
    static_configs:
      - targets: ["notificaciones:9464"]
