name: recienhecho

services:
  api-gateway:
    build: ./backend/api-gateway
    container_name: recienhecho-api-gateway
    environment:
      PORT: ${API_GATEWAY_PORT}
      # Sin los mensajes de depuración de Gin: los logs quedan solo en JSON (ADR-006).
      GIN_MODE: release
      # Instancias de notificaciones entre las que reparte el gateway (ADR-012).
      NOTIFICACIONES_URLS: http://notificaciones:${NOTIFICACIONES_PORT}
      PEDIDOS_URLS: http://pedidos:${PEDIDOS_PORT}
      PRODUCTOS_URLS: http://productos:${PRODUCTOS_PORT}
      # Destino de las trazas (ADR-006). Si Jaeger no está, el gateway funciona igual.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on: [notificaciones, pedidos, productos]
    networks: [interna]

  usuarios:
    build: ./backend/usuarios
    container_name: recienhecho-usuarios
    environment:
      PORT: ${USUARIOS_PORT}
      GIN_MODE: release
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Cada operación con MySQL se corta a los 2 s (ADR-011).
      MYSQL_DSN: ${USUARIOS_MYSQL_USUARIO}:${USUARIOS_MYSQL_CLAVE}@tcp(mysql-usuarios:3306)/usuarios?timeout=2s&readTimeout=2s&writeTimeout=2s
      # Firma los tokens de sesión; el api-gateway los verifica con el mismo (ADR-016).
      JWT_SECRETO: ${JWT_SECRETO}
      # Cuenta del vendedor: se crea al arrancar si no existe (ADR-016).
      VENDEDOR_EMAIL: ${VENDEDOR_EMAIL}
      VENDEDOR_CLAVE: ${VENDEDOR_CLAVE}
    # Sin puerto publicado: se entra solo por el api-gateway (ADR-001, ADR-012).
    depends_on:
      mysql-usuarios:
        condition: service_healthy
    networks: [interna]

  # Base propia de usuarios (ADR-002). La clave de root es al azar: el servicio
  # usa su propio usuario.
  mysql-usuarios:
    image: mysql:8.4.10
    container_name: recienhecho-mysql-usuarios
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: usuarios
      MYSQL_USER: ${USUARIOS_MYSQL_USUARIO}
      MYSQL_PASSWORD: ${USUARIOS_MYSQL_CLAVE}
    volumes:
      - mysql-usuarios-datos:/var/lib/mysql
    ports:
      # Solo desde esta compu (127.0.0.1), como las demás bases (ADR-006).
      - "127.0.0.1:${USUARIOS_MYSQL_PORT}:3306"
    # Por TCP: el servidor temporal que MySQL levanta para inicializarse no
    # escucha en la red, así que no da un "listo" falso.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [interna]

  productos:
    build: ./backend/productos
    container_name: recienhecho-productos
    environment:
      PORT: ${PRODUCTOS_PORT}
      GIN_MODE: release
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Cada operación con MySQL se corta a los 2 s (ADR-011).
      MYSQL_DSN: ${PRODUCTOS_MYSQL_USUARIO}:${PRODUCTOS_MYSQL_CLAVE}@tcp(mysql-productos:3306)/productos?timeout=2s&readTimeout=2s&writeTimeout=2s
      REDIS_URL: redis://redis-productos:6379/0
      CACHE_HABILITADA: ${CACHE_HABILITADA}
      MEILI_URL: http://meilisearch:7700
      MEILI_CLAVE: ${MEILI_CLAVE}
      IMAGENES_DIR: /datos/imagenes
    volumes:
      # Las fotos que sube el vendedor (ADR-002).
      - productos-imagenes:/datos/imagenes
    # Sin puerto publicado: se entra solo por el api-gateway (ADR-001, ADR-012).
    # Solo espera a MySQL: sin Redis lee de MySQL, y sin Meilisearch los cambios
    # esperan en la bandeja del índice (ADR-011).
    depends_on:
      mysql-productos:
        condition: service_healthy
    networks: [interna]

  # Base propia de productos (ADR-002). La clave de root es al azar: el servicio
  # usa su propio usuario.
  mysql-productos:
    image: mysql:8.4.10
    container_name: recienhecho-mysql-productos
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: productos
      MYSQL_USER: ${PRODUCTOS_MYSQL_USUARIO}
      MYSQL_PASSWORD: ${PRODUCTOS_MYSQL_CLAVE}
    volumes:
      - mysql-productos-datos:/var/lib/mysql
    ports:
      # Solo desde esta compu (127.0.0.1), como las demás bases (ADR-006).
      - "127.0.0.1:${PRODUCTOS_MYSQL_PORT}:3306"
    # Por TCP: el servidor temporal que MySQL levanta para inicializarse no
    # escucha en la red, así que no da un "listo" falso.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [interna]

  # Caché del catálogo (ADR-009). Sin volumen: lo que guarda se puede perder.
  redis-productos:
    image: redis:7.4.11
    container_name: recienhecho-redis-productos
    ports:
      # Solo desde esta compu (127.0.0.1): no tiene clave.
      - "127.0.0.1:${PRODUCTOS_REDIS_PORT}:6379"
    networks: [interna]

  # Motor de búsqueda de productos (ADR-008). Su web sirve para probar búsquedas.
  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    container_name: recienhecho-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_CLAVE}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-datos:/meili_data
    ports:
      # Solo desde esta compu (127.0.0.1), como las demás herramientas de desarrollo (ADR-006).
      - "127.0.0.1:${MEILI_PORT}:7700"
    networks: [interna]

  pedidos:
    build: ./backend/pedidos
    container_name: recienhecho-pedidos
    environment:
      PORT: ${PEDIDOS_PORT}
      GIN_MODE: release
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # replicaSet: las transacciones de MongoDB necesitan un replica set (D4).
      MONGO_URI: mongodb://${PEDIDOS_MONGO_USUARIO}:${PEDIDOS_MONGO_CLAVE}@mongo-pedidos:27017/?authSource=admin&replicaSet=rs0
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CLAVE}@rabbitmq:5672/
      PRODUCTOS_URL: http://productos:${PRODUCTOS_PORT}
      # Inventario falso hasta tener el contrato del proveedor (ADR-010): confirma,
      # sin_stock, lento, error o rechazo, para la demo y las caídas provocadas.
      INVENTARIO_MODO: ${INVENTARIO_MODO}
    # Sin puerto publicado: se entra solo por el api-gateway (ADR-001, ADR-012).
    # No depende de RabbitMQ para arrancar: si no está, los eventos esperan en la
    # bandeja de salida (ADR-011).
    depends_on:
      mongo-pedidos:
        condition: service_healthy
    networks: [interna]

  # Base propia de pedidos (ADR-002). Corre como replica set de un solo nodo porque
  # pedidos usa transacciones (D4). La clave interna del replica set se genera al
  # arrancar: con un solo nodo no se comparte con nadie.
  mongo-pedidos:
    image: mongo:8
    container_name: recienhecho-mongo-pedidos
    entrypoint:
      - bash
      - -c
      - >-
        head -c 756 /dev/urandom | base64 > /tmp/clave-replica &&
        chmod 400 /tmp/clave-replica && chown 999:999 /tmp/clave-replica &&
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/clave-replica --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PEDIDOS_MONGO_USUARIO}
      MONGO_INITDB_ROOT_PASSWORD: ${PEDIDOS_MONGO_CLAVE}
    volumes:
      - mongo-pedidos-datos:/data/db
    ports:
      # Solo desde esta compu (127.0.0.1), como la de notificaciones (ADR-006).
      # Desde afuera del compose hay que conectarse con ?directConnection=true.
      - "127.0.0.1:${PEDIDOS_MONGO_PORT}:27017"
    # El chequeo también inicia el replica set la primera vez.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --quiet --eval
          "try { rs.status().ok } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo-pedidos:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
    networks: [interna]

  # Broker de eventos entre pedidos y notificaciones (ADR-003). La web de
  # administración muestra las colas, incluida la de fallidos.
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: recienhecho-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE}
    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq
    ports:
      # Solo desde esta compu (127.0.0.1), como las demás herramientas de desarrollo (ADR-006).
      - "127.0.0.1:${RABBITMQ_WEB_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [interna]

  notificaciones:
    build: ./backend/notificaciones
    container_name: recienhecho-notificaciones
    environment:
      PORT: ${NOTIFICACIONES_PORT}
      GIN_MODE: release
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      MONGO_URI: mongodb://${NOTIFICACIONES_MONGO_USUARIO}:${NOTIFICACIONES_MONGO_CLAVE}@mongo-notificaciones:27017/?authSource=admin
      NOTIFICACIONES_CLAVES_API: ${NOTIFICACIONES_CLAVES_API}
      # Consume los eventos de pedidos (ADR-003). Si RabbitMQ no está, reintenta solo.
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CLAVE}@rabbitmq:5672/
      # Mailpit en desarrollo; para Gmail se cambian estas variables en el .env (ADR-005).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PUERTO: ${SMTP_PUERTO}
      SMTP_USUARIO: ${SMTP_USUARIO}
      SMTP_CLAVE: ${SMTP_CLAVE}
      SMTP_REMITENTE: ${SMTP_REMITENTE}
    # Sin puerto publicado: se entra solo por el api-gateway (ADR-001, ADR-012).
    depends_on:
      mongo-notificaciones:
        condition: service_healthy
    networks: [interna]

  # Base propia de notificaciones (ADR-002): ningún otro servicio se conecta acá.
  mongo-notificaciones:
    image: mongo:8
    container_name: recienhecho-mongo-notificaciones
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${NOTIFICACIONES_MONGO_USUARIO}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICACIONES_MONGO_CLAVE}
    volumes:
      - mongo-notificaciones-datos:/data/db
    ports:
      # Solo desde esta compu (127.0.0.1): la clave de desarrollo no queda expuesta a la red local (ADR-006).
      - "127.0.0.1:${NOTIFICACIONES_MONGO_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]

  # Buzón falso para desarrollo y tests (ADR-005): atrapa los mails y los muestra en una web.
  mailpit:
    image: axllent/mailpit
    container_name: recienhecho-mailpit
    ports:
      # Solo desde esta compu (127.0.0.1): la web muestra el contenido de los mails.
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT}:8025"
    networks: [interna]

  # Recibe las trazas por OTLP y las muestra en una web (ADR-006). Ningún servicio
  # depende de que esté arriba: sin Jaeger, solo se pierden las trazas.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: recienhecho-jaeger
    ports:
      # Solo desde esta compu (127.0.0.1), como Prometheus y Grafana (ADR-006).
      - "127.0.0.1:${JAEGER_WEB_PORT}:16686"
    networks: [interna]

  # Lee /metrics de los servicios cada 15 s (puerto interno 9464) y evalúa las
  # alertas de observabilidad/prometheus/alertas.yml (ADR-006).
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: recienhecho-prometheus
    volumes:
      - ./observabilidad/prometheus:/etc/prometheus:ro
    ports:
      # Solo desde esta compu (127.0.0.1): no se expone a la red local.
      - "127.0.0.1:${PROMETHEUS_WEB_PORT}:9090"
    networks: [interna]

  # Tablero con las métricas de Prometheus y acceso a las trazas de Jaeger. Las
  # fuentes y el tablero salen de observabilidad/grafana: no hay que configurar nada a mano.
  grafana:
    image: grafana/grafana:13.2.3
    container_name: recienhecho-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_CLAVE}
      # Cualquiera puede ver el tablero sin iniciar sesión, pero no editarlo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableros/recien-hecho.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/tableros:/var/lib/grafana/tableros:ro
    ports:
      # Solo desde esta compu (127.0.0.1): el acceso anónimo no llega a la red local.
      - "127.0.0.1:${GRAFANA_WEB_PORT}:3000"
    depends_on: [prometheus]
    networks: [interna]

  # Mock del contrato publicado (docs/contracts/notificaciones.yaml), ver ADR-004.
  notificaciones-mock:
    image: stoplight/prism:5
    container_name: recienhecho-notificaciones-mock
    command: mock -m false -h 0.0.0.0 -p ${NOTIFICACIONES_MOCK_PORT} /contrato/notificaciones.yaml
    volumes:
      - ./docs/contracts:/contrato:ro
    ports:
      # Solo desde esta compu (127.0.0.1), como las demás herramientas de desarrollo (ADR-006).
      - "127.0.0.1:${NOTIFICACIONES_MOCK_PORT}:${NOTIFICACIONES_MOCK_PORT}"
    networks: [interna]

volumes:
  mongo-notificaciones-datos:
  mongo-pedidos-datos:
  rabbitmq-datos:
  mysql-productos-datos:
  meilisearch-datos:
  productos-imagenes:
  mysql-usuarios-datos:

networks:
  interna:
